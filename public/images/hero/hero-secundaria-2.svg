<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 375" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSec2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F3"/>
      <stop offset="100%" stop-color="#EFE6DD"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgSec2)"/>
  
  <!-- Gotero de Aceite esencial -->
  <g transform="translate(160, 60)">
    <!-- Bulbo del gotero -->
    <rect x="75" y="10" width="30" height="25" rx="10" fill="#2E282A"/>
    <rect x="70" y="35" width="40" height="20" rx="4" fill="#C59B27"/>
    <!-- Frasco vidrio ámbar -->
    <rect x="45" y="55" width="90" height="150" rx="20" fill="#9C5221" opacity="0.9"/>
    <!-- Etiqueta -->
    <rect x="55" y="90" width="70" height="80" rx="8" fill="#FFFDF7"/>
    <text x="90" y="125" font-family="'Cormorant Garamond', serif" font-size="14" font-weight="bold" fill="#731A26" text-anchor="middle">alma.</text>
    <text x="90" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#8C827A" text-anchor="middle">ÓLEO</text>
  </g>

  <!-- Nota de reemplazo -->
  <rect x="70" y="300" width="360" height="36" rx="18" fill="#FFFDF7" stroke="#F4D5D8"/>
  <text x="250" y="323" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#731A26" text-anchor="middle">
    Tu imagen: /images/hero/hero-secundaria-2.jpg
  </text>
</svg>

